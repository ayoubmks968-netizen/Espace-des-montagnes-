<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Espace des Montagnes — Café · Restaurant · Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,600&family=DM+Sans:wght@300;400;500&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#1a1208;
  --deep:#0f1a0f;
  --forest:#1c3620;
  --fern:#2e6b3e;
  --sage:#5a9e6a;
  --orange:#c85a1a;
  --amber:#d4882a;
  --gold:#b8882a;
  --cream:#faf5ea;
  --sand:#f0e4c8;
  --mist:#e4d8c0;
  --marble:#f4f0f8;
  --navy:#1a2540;
  --white:#ffffff;
  --ff-d:'Cormorant Garamond',Georgia,serif;
  --ff-b:'DM Sans',system-ui,sans-serif;
  --ff-a:'Scheherazade New',serif;
  --ease:cubic-bezier(.22,.68,0,1.2);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--ff-b);background:var(--cream);color:var(--ink);overflow-x:hidden}
body.ar{font-family:var(--ff-a);direction:rtl}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{display:block;max-width:100%;height:auto}

/* ── LANGBAR ── */
.lb{position:fixed;top:0;left:0;right:0;z-index:999;
  background:rgba(15,26,15,.95);backdrop-filter:blur(14px);
  display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:9px 28px}
.lb__btn{color:rgba(255,255,255,.45);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 14px;border-radius:20px;border:1px solid transparent;transition:all .2s}
.lb__btn:hover{color:var(--white);border-color:rgba(255,255,255,.2)}
.lb__btn.on{background:var(--orange);color:var(--white);border-color:var(--orange)}

/* ── NAV ── */
.nav{position:fixed;top:40px;left:0;right:0;z-index:998;
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 48px;transition:all .35s}
.nav.up{background:rgba(250,245,234,.97);backdrop-filter:blur(12px);
  box-shadow:0 2px 28px rgba(0,0,0,.08);padding:12px 48px}
.nav__logo{display:flex;align-items:center;gap:12px}
.nav__logo img{width:52px;height:52px;object-fit:contain;border-radius:50%;
  background:var(--cream);padding:4px;transition:width .3s,height .3s}
.nav.up .nav__logo img{width:40px;height:40px}
.nav__logo-txt{font-family:var(--ff-d);font-size:1.35rem;font-weight:600;
  color:var(--white);letter-spacing:.02em;transition:color .3s}
.nav.up .nav__logo-txt{color:var(--forest)}
.nav__links{display:flex;gap:28px;list-style:none}
.nav__links a{font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.7);font-weight:500;transition:color .2s;
  position:relative;padding-bottom:3px}
.nav__links a::after{content:'';position:absolute;bottom:0;left:0;right:0;
  height:1.5px;background:var(--orange);transform:scaleX(0);transition:transform .25s var(--ease);transform-origin:left}
.nav__links a:hover{color:var(--white)}
.nav__links a:hover::after{transform:scaleX(1)}
.nav.up .nav__links a{color:rgba(26,18,8,.55)}
.nav.up .nav__links a:hover{color:var(--ink)}

/* ── MAGNETIC BUTTON ── */
.mag-btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 30px;border-radius:50px;font-size:13px;font-weight:500;letter-spacing:.07em;
  overflow:hidden;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;
  border:none;font-family:var(--ff-b);
}
.mag-btn::before{
  content:'';position:absolute;inset:0;
  background:conic-gradient(from 0deg,var(--orange),var(--amber),var(--gold),var(--orange));
  border-radius:inherit;
  animation:spingrad 3s linear infinite;
  opacity:0;transition:opacity .3s;
}
.mag-btn::after{
  content:'';position:absolute;inset:2px;
  background:inherit;border-radius:inherit;z-index:1;
}
.mag-btn:hover::before{opacity:1}
.mag-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 36px rgba(200,90,26,.4)}
@keyframes spingrad{to{transform:rotate(360deg)}}
.mag-btn span{position:relative;z-index:2;pointer-events:none}
.mag-btn svg{position:relative;z-index:2;pointer-events:none}

.mbtn-fire{background:var(--orange);color:var(--white)}
.mbtn-ghost{background:rgba(255,255,255,.1);color:var(--white);border:1.5px solid rgba(255,255,255,.3)}
.mbtn-dark{background:var(--forest);color:var(--white)}
.mbtn-gold{background:var(--gold);color:var(--ink)}
.mbtn-outline{background:transparent;color:var(--forest);border:2px solid var(--forest)}

.ham{display:none;flex-direction:column;gap:5px;cursor:pointer}
.ham span{display:block;width:24px;height:2px;background:var(--white);
  border-radius:2px;transition:all .3s}
.nav.up .ham span{background:var(--ink)}

/* ── HERO ── */
.hero{
  min-height:100vh;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding-bottom:80px;
}
