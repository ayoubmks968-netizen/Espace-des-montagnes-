<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Espace des Montagnes — Café · Restaurant · Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=DM+Sans:wght@300;400;500&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root{
  --ink:     #0e130e;
  --bark:    #2b1f10;
  --pine:    #1c3620;
  --fern:    #3a6b3a;
  --sage:    #7aab6a;
  --ember:   #d4622a;
  --sand:    #f0e8d8;
  --parchm:  #faf6ef;
  --mist:    #e6dfd0;
  --gold:    #b8882a;
  --white:   #ffffff;

  --ff-display: 'Cormorant Garamond', Georgia, serif;
  --ff-body:    'DM Sans', system-ui, sans-serif;
  --ff-arabic:  'Scheherazade New', serif;

  --ease: cubic-bezier(.22,.68,0,1.2);
}

/* ═══════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--ff-body);
  background:var(--parchm);
  color:var(--ink);
  overflow-x:hidden;
  transition:font-family .2s;
}
body.ar{font-family:var(--ff-arabic); direction:rtl}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* ═══════════════════════════════════════
   LANGUAGE BAR
═══════════════════════════════════════ */
.langbar{
  position:fixed; top:0; left:0; right:0; z-index:999;
  background:rgba(14,19,14,.92);
  backdrop-filter:blur(12px);
  display:flex; justify-content:flex-end; align-items:center;
  gap:6px; padding:10px 28px;
}
.langbar__btn{
  color:rgba(255,255,255,.55);
  font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  padding:5px 14px; border-radius:20px;
  border:1px solid transparent;
  transition:all .2s;
}
.langbar__btn:hover{color:var(--white); border-color:rgba(255,255,255,.2)}
.langbar__btn.on{
  background:var(--ember); color:var(--white); border-color:var(--ember);
}

/* ═══════════════════════════════════════
   NAV
═══════════════════════════════════════ */
.nav{
  position:fixed; top:42px; left:0; right:0; z-index:998;
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 40px;
  transition:background .3s, padding .3s, box-shadow .3s;
}
.nav.scrolled{
  background:rgba(250,246,239,.97);
  backdrop-filter:blur(10px);
  box-shadow:0 2px 24px rgba(0,0,0,.07);
  padding:12px 40px;
}
.nav__logo{
  font-family:var(--ff-display); font-size:1.5rem; font-weight:600;
  color:var(--white); letter-spacing:.02em;
  transition:color .3s;
}
.nav.scrolled .nav__logo{color:var(--pine)}
.nav__links{display:flex; gap:32px; list-style:none}
.nav__links a{
  font-size:13px; letter-spacing:.1em; text-transform:uppercase;
  color:rgba(255,255,255,.7); font-weight:500;
  transition:color .2s; position:relative; padding-bottom:3px;
}
.nav__links a::after{
  content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
  background:var(--ember); transform:scaleX(0); transition:transform .25s var(--ease);
}
.nav__links a:hover{color:var(--white)}
.nav__links a:hover::after{transform:scaleX(1)}
.nav.scrolled .nav__links a{color:rgba(14,19,14,.6)}
.nav.scrolled .nav__links a:hover{color:var(--ink)}
.nav__reserve{
  background:var(--ember); color:var(--white);
  padding:9px 22px; border-radius:25px; font-size:13px; font-weight:500;
  letter-spacing:.06em; transition:all .2s;
}
.nav__reserve:hover{background:#bf4e18; transform:translateY(-1px); box-shadow:0 6px 18px rgba(212,98,42,.35)}
.hamburger{display:none; flex-direction:column; gap:5px; cursor:pointer}
.hamburger span{display:block; width:24px; height:2px; background:var(--white); border-radius:2px; transition:all .3s}
.nav.scrolled .hamburger span{background:var(--ink)}

/* ═══════════════════════════════════════
   HERO — cinematic split
═══════════════════════════════════════ */
.hero{
  min-height:100vh;
  background:
    linear-gradient(160deg, rgba(14,19,14,.85) 0%, rgba(28,54,32,.6) 55%, rgba(14,19,14,.75) 100%),
    url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=1800&q=80') center/cover no-repeat;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:0 0 90px;
  position:relative; overflow:hidden;
}
.hero__bg-text{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:var(--ff-display); font-size:clamp(8rem,18vw,20rem);
  font-weight:600; font-style:italic;
  color:rgba(255,255,255,.04); white-space:nowrap;
  pointer-events:none; user-select:none; letter-spacing:-.02em;
}
.hero__inner{
  max-width:1200px; margin:0 auto; padding:0 40px;
  display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:end;
}
.hero__left{}
.hero__eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  color:var(--sage); font-size:11px; letter-spacing:.25em; text-transform:uppercase;
  margin-bottom:24px;
}
.hero__eyebrow::before{content:''; width:28px; height:1px; background:var(--sage)}
.hero__h1{
  font-family:var(--ff-display); font-size:clamp(3.5rem,7vw,6.5rem);
  font-weight:300; color:var(--white); line-height:1.0;
  letter-spacing:-.01em;
}
.hero__h1 em{font-style:italic; font-weight:600; color:var(--sand)}
.hero__pills{
  display:flex; flex-wrap:wrap; gap:10px; margin:28px 0 36px;
}
.hero__pill{
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.85); padding:7px 16px; border-radius:20px;
  font-size:13px; display:flex; align-items:center; gap:7px;
  backdrop-filter:blur(4px);
}
.hero__cta{display:flex; gap:14px; flex-wrap:wrap}
.btn-fire{
  background:var(--ember); color:var(--white);
  padding:14px 32px; border-radius:30px; font-size:14px; font-weight:500;
  display:inline-flex; align-items:center; gap:9px;
  transition:all .25s; letter-spacing:.04em;
}
.btn-fire:hover{background:#bf4e18; transform:translateY(-2px); box-shadow:0 10px 28px rgba(212,98,42,.4)}
.btn-ghost{
  background:rgba(255,255,255,.1); color:var(--white);
  padding:14px 30px; border-radius:30px; font-size:14px;
  border:1.5px solid rgba(255,255,255,.3);
  display:inline-flex; align-items:center; gap:9px;
  transition:all .25s; backdrop-filter:blur(4px);
}
.btn-ghost:hover{background:rgba(255,255,255,.18)}
.hero__right{
  display:flex; flex-direction:column; align-items:flex-end; gap:16px;
}
.hero__stat{
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  border-radius:16px; padding:20px 28px; text-align:right;
  backdrop-filter:blur(8px); width:fit-content;
}
.hero__stat-num{
  font-family:var(--ff-display); font-size:2.8rem; font-weight:600; color:var(--white);
  line-height:1;
}
.hero__stat-label{color:rgba(255,255,255,.55); font-size:12px; letter-spacing:.1em; margin-top:4px}
.hero__open{
  background:rgba(74,124,63,.25); border:1px solid var(--fern);
  color:#a8e098; padding:10px 20px; border-radius:25px;
  font-size:13px; display:flex; align-items:center; gap:9px;
}
.hero__dot{
  width:8px; height:8px; background:#a8e098; border-radius:50%;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.hero__scroll{
  position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.35); font-size:11px; letter-spacing:.2em;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.hero__scroll::after{
  content:''; width:1px; height:40px; background:rgba(255,255,255,.25);
  animation:scrollline 1.5s ease-in-out infinite;
}
@keyframes scrollline{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ═══════════════════════════════════════
   SECTION SHARED
═══════════════════════════════════════ */
.sec{padding:100px 0}
.sec--alt{background:var(--sand)}
.sec--dark{background:var(--pine); color:var(--white)}
.container{max-width:1200px; margin:0 auto; padding:0 40px}
.sec__eyebrow{
  font-size:11px; letter-spacing:.25em; text-transform:uppercase;
  color:var(--ember); font-weight:500; margin-bottom:14px;
  display:flex; align-items:center; gap:12px;
}
.sec__eyebrow::before{content:''; width:24px; height:1px; background:var(--ember)}
.sec__h2{
  font-family:var(--ff-display); font-size:clamp(2.2rem,4vw,3.8rem);
  font-weight:300; line-height:1.15; margin-bottom:20px;
}
.sec__h2 em{font-style:italic; font-weight:600}
.sec__lead{color:#5a6e5a; font-size:1.05rem; line-height:1.8; max-width:520px}
.sec--dark .sec__lead{color:rgba(255,255,255,.65)}

/* ═══════════════════════════════════════
   ABOUT — asymmetric
═══════════════════════════════════════ */
.about__grid{
  display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center;
}
.about__img-stack{position:relative; height:520px}
.about__img-main{
  width:78%; height:80%; object-fit:cover; border-radius:4px 24px 4px 24px;
  position:absolute; top:0; left:0;
  box-shadow:0 30px 70px rgba(0,0,0,.15);
}
.about__img-accent{
  width:55%; height:55%; object-fit:cover; border-radius:24px 4px 24px 4px;
  position:absolute; bottom:0; right:0;
  box-shadow:0 20px 50px rgba(0,0,0,.18);
  border:5px solid var(--parchm);
}
.about__badge{
  position:absolute; top:50%; right:-20px; transform:translateY(-50%);
  background:var(--ember); color:var(--white); padding:18px 22px; border-radius:16px;
  text-align:center; box-shadow:0 12px 32px rgba(212,98,42,.35);
  z-index:2;
}
.about__badge-num{font-family:var(--ff-display); font-size:2.2rem; font-weight:600; line-height:1}
.about__badge-txt{font-size:11px; letter-spacing:.1em; opacity:.85; margin-top:3px}
.about__values{display:flex; flex-direction:column; gap:20px; margin-top:40px}
.about__val{
  display:flex; gap:16px; align-items:flex-start;
  padding:18px 20px; background:var(--parchm); border-radius:14px;
  border:1px solid var(--mist);
}
.about__val-icon{font-size:1.6rem; flex-shrink:0; margin-top:2px}
.about__val-title{font-weight:500; margin-bottom:4px; font-size:.95rem}
.about__val-desc{font-size:.85rem; color:#6a7a6a; line-height:1.6}

/* ═══════════════════════════════════════
   MENU — tabbed
═══════════════════════════════════════ */
.menu__tabs{
  display:flex; gap:8px; margin-bottom:50px; flex-wrap:wrap;
}
.menu__tab{
  padding:10px 24px; border-radius:25px; font-size:13px; letter-spacing:.06em;
  border:1.5px solid var(--mist); color:#6a7a6a; transition:all .2s;
}
.menu__tab:hover{border-color:var(--fern); color:var(--fern)}
.menu__tab.on{background:var(--pine); color:var(--white); border-color:var(--pine)}
.menu__panel{display:none}
.menu__panel.on{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:24px}
.dish{
  background:var(--white); border-radius:20px; overflow:hidden;
  border:1px solid var(--mist); transition:all .3s;
}
.dish:hover{transform:translateY(-5px); box-shadow:0 20px 50px rgba(0,0,0,.1)}
.dish__img{
  height:185px; overflow:hidden;
  background:linear-gradient(135deg,#c5b8a0,#a89278);
  display:flex; align-items:center; justify-content:center;
  font-size:3.5rem; position:relative;
}
.dish__img img{width:100%;height:100%;object-fit:cover}
.dish__badge-new{
  position:absolute; top:12px; right:12px;
  background:var(--ember); color:var(--white);
  font-size:10px; letter-spacing:.1em; padding:4px 10px; border-radius:12px;
}
.dish__body{padding:20px}
.dish__name{font-family:var(--ff-display); font-size:1.3rem; font-weight:600; margin-bottom:5px}
.dish__desc{font-size:13px; color:#7a8a7a; line-height:1.6; margin-bottom:14px}
.dish__footer{display:flex; justify-content:space-between; align-items:center}
.dish__price{font-family:var(--ff-display); font-size:1.4rem; font-weight:600; color:var(--ember)}
.dish__tag{
  font-size:11px; padding:4px 10px; border-radius:12px;
  background:var(--sand); color:#6a7a6a; border:1px solid var(--mist);
}

/* ═══════════════════════════════════════
   EXPERIENCE STRIP
═══════════════════════════════════════ */
.strip{
  background:var(--bark);
  padding:70px 0; overflow:hidden;
}
.strip__inner{
  display:flex; gap:0; max-width:1200px; margin:0 auto;
}
.strip__item{
  flex:1; padding:40px 36px; border-right:1px solid rgba(255,255,255,.08);
  text-align:center; transition:background .3s;
}
.strip__item:last-child{border-right:none}
.strip__item:hover{background:rgba(255,255,255,.04)}
.strip__icon{font-size:2.8rem; margin-bottom:16px; display:block}
.strip__title{
  font-family:var(--ff-display); font-size:1.4rem; font-weight:600;
  color:var(--sand); margin-bottom:8px;
}
.strip__desc{font-size:13px; color:rgba(255,255,255,.5); line-height:1.7}

/* ═══════════════════════════════════════
   GALLERY — mosaic
═══════════════════════════════════════ */
.gallery__mosaic{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,220px);
  gap:10px; border-radius:20px; overflow:hidden;
}
.gallery__cell{overflow:hidden; position:relative; cursor:pointer}
.gallery__cell--big{grid-column:span 2; grid-row:span 2}
.gallery__cell img,
.gallery__cell .gallery__placeholder{
  width:100%;height:100%;object-fit:cover;
  transition:transform .5s var(--ease);
}
.gallery__cell:hover img,
.gallery__cell:hover .gallery__placeholder{transform:scale(1.06)}
.gallery__placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--mist); gap:8px; color:#9aaa9a; font-size:13px;
}
.gallery__placeholder span{font-size:2.5rem}
.gallery__overlay{
  position:absolute; inset:0;
  background:linear-gradient(to top,rgba(14,19,14,.6) 0%,transparent 60%);
  opacity:0; transition:opacity .3s;
  display:flex; align-items:flex-end; padding:16px;
}
.gallery__cell:hover .gallery__overlay{opacity:1}
.gallery__overlay-txt{color:var(--white); font-size:13px; letter-spacing:.06em}
.gallery__upload{
  margin-top:20px; border:2px dashed var(--gold);
  border-radius:16px; padding:28px; text-align:center; cursor:pointer;
  transition:background .2s; background:rgba(184,136,42,.04);
  display:flex; align-items:center; justify-content:center; gap:14px;
}
.gallery__upload:hover{background:rgba(184,136,42,.09)}
.gallery__upload-icon{font-size:2rem}
.gallery__upload-txt strong{display:block; color:var(--gold); font-size:.9rem}
.gallery__upload-txt small{font-size:.8rem; color:#9aaa9a}
#imgInput{display:none}

/* LIGHTBOX */
.lbox{
  display:none; position:fixed; inset:0; z-index:9999;
  background:rgba(0,0,0,.94); align-items:center; justify-content:center;
}
.lbox.open{display:flex}
.lbox__img{max-width:90vw;max-height:88vh;border-radius:8px;object-fit:contain}
.lbox__close{
  position:absolute; top:22px; right:26px;
  color:rgba(255,255,255,.6); font-size:2rem; cursor:pointer;
  background:none; border:none; transition:color .2s;
}
.lbox__close:hover{color:white}

/* ═══════════════════════════════════════
   WORLD CUP BANNER
═══════════════════════════════════════ */
.wcup{
  background:
    linear-gradient(135deg,rgba(28,54,32,.93) 0%,rgba(14,19,14,.97) 100%),
    url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1200&q=70') center/cover;
  border-radius:28px; margin:0 40px 100px;
  padding:80px 60px; position:relative; overflow:hidden;
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:60px;
}
.wcup::before{
  content:'⚽'; font-size:280px; position:absolute;
  right:-40px; top:-60px; opacity:.04; pointer-events:none;
}
.wcup__eyebrow{
  display:flex; align-items:center; gap:12px;
  font-size:11px; letter-spacing:.2em; color:var(--sage);
  margin-bottom:18px;
}
.wcup__h2{
  font-family:var(--ff-display); font-size:clamp(2rem,4.5vw,3.5rem);
  font-weight:300; color:var(--white); margin-bottom:16px; line-height:1.1;
}
.wcup__h2 em{font-style:italic; font-weight:600; color:var(--sand)}
.wcup__p{color:rgba(255,255,255,.6); font-size:1rem; line-height:1.8; max-width:500px}
.wcup__flags{font-size:4rem; letter-spacing:16px; display:block; margin-bottom:24px}
.wcup__right{display:flex; flex-direction:column; align-items:center; gap:16px}
.wcup__schedule{
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
  border-radius:18px; padding:24px 30px; text-align:center; width:220px;
}
.wcup__schedule-title{
  font-size:11px; letter-spacing:.15em; color:var(--sage);
  text-transform:uppercase; margin-bottom:16px;
}
.wcup__match{
  display:flex; align-items:center; gap:10px; justify-content:center;
  padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08);
  font-size:14px; color:rgba(255,255,255,.8);
}
.wcup__match:last-child{border-bottom:none}
.wcup__match-flag{font-size:1.2rem}

/* ═══════════════════════════════════════
   RESERVATION
═══════════════════════════════════════ */
.res__grid{
  display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:start;
}
.res__info{}
.res__info-list{list-style:none; display:flex; flex-direction:column; gap:18px; margin-top:36px}
.res__info-item{
  display:flex; gap:16px; align-items:flex-start;
  padding:18px 20px; border-radius:14px; background:var(--mist);
}
.res__info-icon{font-size:1.5rem; flex-shrink:0}
.res__info-key{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--fern); margin-bottom:4px}
.res__info-val{font-weight:500; color:var(--ink)}
.res__form{
  background:var(--white); border-radius:24px;
  padding:40px; border:1px solid var(--mist);
  box-shadow:0 20px 60px rgba(0,0,0,.06);
}
.res__form h3{
  font-family:var(--ff-display); font-size:1.8rem; font-weight:600;
  margin-bottom:28px; color:var(--ink);
}
.fgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.fg{display:flex; flex-direction:column; gap:7px}
.fg.full{grid-column:1/-1}
.fg label{
  font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--fern); font-weight:500;
}
.fg input,.fg select,.fg textarea{
  background:var(--parchm); border:1.5px solid var(--mist);
  border-radius:12px; padding:12px 16px; font-size:15px;
  font-family:inherit; color:var(--ink); outline:none;
  transition:border-color .2s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--ember)}
.fg textarea{resize:vertical; min-height:90px}
.res__submit{
  margin-top:18px; width:100%; padding:15px;
  background:var(--pine); color:var(--white);
  border-radius:14px; font-size:15px; font-weight:500;
  transition:all .25s; letter-spacing:.04em;
}
.res__submit:hover{background:var(--fern); transform:translateY(-2px); box-shadow:0 10px 28px rgba(28,54,32,.3)}
.res__success{
  display:none; margin-top:16px;
  background:rgba(58,107,58,.1); border:1px solid var(--fern);
  color:var(--pine); padding:14px 18px; border-radius:12px; font-size:14px;
}

/* ═══════════════════════════════════════
   CONTACT
═══════════════════════════════════════ */
.contact__row{
  display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:50px;
}
.ccard{
  padding:28px 22px; border-radius:20px; text-align:center;
  background:var(--white); border:1px solid var(--mist); transition:all .25s;
  text-decoration:none; color:inherit; display:block;
}
.ccard:hover{transform:translateY(-5px); box-shadow:0 16px 40px rgba(0,0,0,.09); border-color:var(--ember)}
.ccard__icon{font-size:2.2rem; margin-bottom:14px; display:block}
.ccard__key{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--ember); margin-bottom:6px}
.ccard__val{font-size:.95rem; font-weight:500; color:var(--ink)}
