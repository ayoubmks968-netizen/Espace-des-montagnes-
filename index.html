<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Espace des Montagnes — Café, Restaurant & Station-service à Meknès. Réservez votre table en ligne. Cuisine marocaine authentique, terrasse panoramique, espace familial."/>
<meta name="keywords" content="restaurant meknès, café meknès, espace des montagnes, cuisine marocaine, réservation restaurant maroc"/>
<meta property="og:title" content="Espace des Montagnes — Café · Restaurant · Station"/>
<meta property="og:description" content="Un refuge familial au cœur du Maroc. Réservez votre table."/>
<title>Espace des Montagnes — Café · Restaurant · Meknès</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════
   TOKENS — drawn from real photos
═══════════════════════════════════ */
:root{
  --rust:#C85A1A;
  --ember:#E07828;
  --forest:#1E3A2F;
  --marble:#F5F2EE;
  --ink:#111A14;
  --gold:#C9952A;
  --mist:#EAE5DC;
  --sage:#6B9E7A;
  --white:#FFFFFF;
  --ff-d:'Playfair Display',Georgia,serif;
  --ff-b:'Plus Jakarta Sans',system-ui,sans-serif;
  --ff-i:'Cormorant Garamond',Georgia,serif;
  --ease:cubic-bezier(.25,.8,.25,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
}

/* ═══════════════════════════════════
   RESET
═══════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:var(--ff-b);background:var(--marble);color:var(--ink);overflow-x:hidden;line-height:1.6}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit}
ul{list-style:none}

/* ═══════════════════════════════════
   PAGES — SPA routing
═══════════════════════════════════ */
.page{display:none;animation:fadeIn .4s var(--ease)}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ═══════════════════════════════════
   HEADER
═══════════════════════════════════ */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:900;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;height:70px;
  background:rgba(17,26,20,0);
  transition:background .4s,box-shadow .4s,height .3s;
}
.hdr.solid{
  background:rgba(17,26,20,.97);
  backdrop-filter:blur(14px);
  box-shadow:0 2px 24px rgba(0,0,0,.2);
  height:62px;
}
.hdr__logo{
  display:flex;align-items:center;gap:10px;cursor:pointer;
}
.hdr__logo-mark{
  width:38px;height:38px;
  background:var(--rust);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;font-weight:900;color:var(--white);
  font-family:var(--ff-d);letter-spacing:-.02em;
  flex-shrink:0;
}
.hdr__logo-txt{
  font-family:var(--ff-d);font-size:1.05rem;font-weight:700;
  color:var(--white);letter-spacing:.01em;line-height:1.2;
}
.hdr__logo-txt small{display:block;font-size:.62rem;font-weight:400;
  letter-spacing:.18em;text-transform:uppercase;opacity:.65;font-family:var(--ff-b)}
.hdr__nav{display:flex;align-items:center;gap:6px}
.hdr__nav a{
  font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;
  color:rgba(255,255,255,.72);padding:8px 14px;border-radius:6px;
  transition:color .2s,background .2s;cursor:pointer;
}
.hdr__nav a:hover,.hdr__nav a.on{color:var(--white);background:rgba(255,255,255,.08)}
.hdr__cta{
  background:var(--rust);color:var(--white);
  font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:9px 22px;border-radius:30px;border:none;cursor:pointer;
  transition:background .2s,transform .2s,box-shadow .2s;
}
.hdr__cta:hover{background:var(--ember);transform:translateY(-2px);box-shadow:0 8px 22px rgba(200,90,26,.4)}
.hdr__ham{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hdr__ham span{display:block;width:22px;height:2px;background:var(--white);border-radius:2px;transition:all .3s}

/* Mobile menu */
.mob{
  display:none;position:fixed;inset:0;z-index:800;
  background:var(--ink);flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
}
.mob.open{display:flex}
.mob a{
  font-family:var(--ff-d);font-size:2.2rem;font-weight:400;
  color:rgba(255,255,255,.7);padding:10px 30px;
  transition:color .2s;cursor:pointer;
}
.mob a:hover{color:var(--rust)}
.mob__close{
  position:absolute;top:24px;right:28px;
  font-size:1.6rem;color:rgba(255,255,255,.4);cursor:pointer;
  background:none;border:none;
}
.mob__cta{
  margin-top:18px;background:var(--rust);color:var(--white);
  font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  padding:13px 34px;border-radius:30px;border:none;cursor:pointer;
}

/* ═══════════════════════════════════
   SHARED COMPONENTS
═══════════════════════════════════ */
/* Tape divider — the signature motif */
.tape{
  display:flex;align-items:center;gap:0;
  margin:0 auto;max-width:200px;
}
.tape::before,.tape::after{
  content:'';flex:1;height:1px;background:var(--rust);opacity:.45;
}
.tape__gem{
  width:8px;height:8px;background:var(--rust);
  transform:rotate(45deg);margin:0 12px;flex-shrink:0;
}

.sec{padding:96px 0}
.sec--dark{background:var(--ink);color:var(--white)}
.sec--forest{background:var(--forest);color:var(--white)}
.sec--sand{background:var(--mist)}
.con{max-width:1160px;margin:0 auto;padding:0 40px}

.eyebrow{
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--rust);font-weight:600;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:'';width:20px;height:1.5px;background:var(--rust)}
h1,h2,h3{font-family:var(--ff-d);line-height:1.12;letter-spacing:-.01em}
h2.headline{font-size:clamp(2rem,3.8vw,3.2rem);font-weight:700;margin-bottom:18px}
h2.headline em{font-style:italic;font-weight:400;color:var(--rust)}
.sec--dark h2.headline em,.sec--forest h2.headline em{color:var(--ember)}
.subline{font-size:1.05rem;line-height:1.8;color:#6a5a40;max-width:520px}
.sec--dark .subline{color:rgba(255,255,255,.58)}
.sec--forest .subline{color:rgba(255,255,255,.65)}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 28px;border-radius:30px;font-size:13px;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  border:none;cursor:pointer;transition:all .25s var(--ease);
}
.btn-fire{background:var(--rust);color:var(--white)}
.btn-fire:hover{background:var(--ember);transform:translateY(-3px);box-shadow:0 12px 30px rgba(200,90,26,.38)}
.btn-outline{background:transparent;color:var(--rust);border:2px solid var(--rust)}
.btn-outline:hover{background:var(--rust);color:var(--white);transform:translateY(-3px)}
.btn-ghost{background:rgba(255,255,255,.1);color:var(--white);border:1.5px solid rgba(255,255,255,.25)}
.btn-ghost:hover{background:rgba(255,255,255,.18)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:#daa830;transform:translateY(-3px)}

/* Cards — warm glow on hover (signature detail) */
.card{
  background:var(--white);border-radius:18px;overflow:hidden;
  border:1.5px solid transparent;
  transition:border-color .3s,box-shadow .3s,transform .3s var(--ease);
}
.card:hover{
  border-color:rgba(200,90,26,.35);
  box-shadow:0 0 0 4px rgba(200,90,26,.06),0 20px 48px rgba(0,0,0,.1);
  transform:translateY(-5px);
}

/* ═══════════════════════════════════
   PAGE 1 — HOME
═══════════════════════════════════ */

/* Hero */
.hero{
  min-height:100vh;position:relative;overflow:hidden;
  display:flex;align-items:flex-end;
}
.hero__bg{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(17,26,20,.55) 0%,rgba(17,26,20,.15) 45%,rgba(17,26,20,.8) 100%),
    url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1800&q=85') center/cover no-repeat;
  transform:scale(1.04);
  animation:heroZoom 12s ease-in-out infinite alternate;
}
@keyframes heroZoom{from{transform:scale(1.04)}to{transform:scale(1.0)}}
.hero__content{
  position:relative;z-index:2;
  max-width:1160px;margin:0 auto;padding:0 40px 90px;
  width:100%;
  display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;
}
.hero__eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  color:var(--sage);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  margin-bottom:22px;
}
.hero__eyebrow::before{content:'';width:28px;height:1px;background:var(--sage)}
.hero__h1{
  font-family:var(--ff-d);font-size:clamp(3.4rem,6.5vw,6rem);
  font-weight:900;color:var(--white);line-height:.98;
  letter-spacing:-.02em;margin-bottom:24px;
}
.hero__h1 em{
  font-style:italic;font-weight:400;
  color:var(--marble);display:block;font-size:.88em;
}
.hero__desc{
  color:rgba(255,255,255,.75);font-size:1.05rem;line-height:1.8;
  margin-bottom:32px;max-width:440px;
}
.hero__btns{display:flex;gap:14px;flex-wrap:wrap}
.hero__right{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.hero__pill{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.9);padding:8px 18px;border-radius:24px;
  font-size:13px;display:flex;align-items:center;gap:8px;
  backdrop-filter:blur(8px);
}
.hero__live{
  background:rgba(46,107,62,.28);border:1px solid var(--sage);
  color:#a8e098;padding:10px 20px;border-radius:24px;
  font-size:12px;display:flex;align-items:center;gap:9px;
}
.hero__dot{width:7px;height:7px;background:#a8e098;border-radius:50%;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.hero__stat{
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  border-radius:16px;padding:18px 26px;backdrop-filter:blur(10px);text-align:right;
}
.hero__stat-n{font-family:var(--ff-d);font-size:2.6rem;font-weight:700;color:var(--white);line-height:1}
.hero__stat-l{color:rgba(255,255,255,.5);font-size:11px;letter-spacing:.1em;margin-top:3px}
.hero__scroll{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;
  color:rgba(255,255,255,.3);font-size:10px;letter-spacing:.22em;
}
.hero__scroll::after{
  content:'';width:1px;height:40px;background:rgba(255,255,255,.25);
  animation:scrollline 1.8s ease-in-out infinite;
}
@keyframes scrollline{
  0%{transform:scaleY(0);transform-origin:top}
  50%{transform:scaleY(1);transform-origin:top}
  51%{transform-origin:bottom}
  100%{transform:scaleY(0);transform-origin:bottom}
}

/* Trust strip */
.trust{background:var(--ink);padding:22px 0;overflow:hidden}
.trust__inner{
  display:flex;gap:0;max-width:1160px;margin:0 auto;padding:0 40px;
  align-items:center;justify-content:space-between;
}
.trust__item{
  display:flex;align-items:center;gap:12px;
  color:rgba(255,255,255,.55);font-size:13px;
  padding:0 24px;border-right:1px solid rgba(255,255,255,.08);
}
.trust__item:last-child{border-right:none}
.trust__item-ico{font-size:1.4rem}
.trust__item strong{display:block;color:rgba(255,255,255,.85);font-size:.92rem}

/* Benefits */
.benefits__grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px;
}
.ben{
  padding:36px 30px;border-radius:20px;
  background:var(--white);border:1.5px solid var(--mist);
  transition:all .3s var(--ease);position:relative;overflow:hidden;
}
.ben::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--rust),var(--gold));
  transform:scaleX(0);transition:transform .35s var(--ease);
}
.ben:hover{border-color:rgba(200,90,26,.3);box-shadow:0 20px 50px rgba(0,0,0,.09);transform:translateY(-6px)}
.ben:hover::after{transform:scaleX(1)}
.ben__ico{font-size:2.6rem;margin-bottom:20px;display:block}
.ben__t{font-family:var(--ff-d);font-size:1.3rem;font-weight:700;margin-bottom:10px}
.ben__d{font-size:.9rem;color:#7a6a50;line-height:1.75}

/* Services preview */
.srvprev__grid{
  display:grid;grid-template-columns:1fr 1fr;gap:3px;
  border-radius:24px;overflow:hidden;margin-top:52px;
}
.srvprev__item{
  position:relative;overflow:hidden;cursor:pointer;
  aspect-ratio:4/3;
}
.srvprev__item:first-child{grid-column:1;grid-row:1/3;aspect-ratio:auto}
.srvprev__item img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s var(--ease);
}
.srvprev__item:hover img{transform:scale(1.07)}
.srvprev__over{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(17,26,20,.82) 0%,transparent 55%);
  display:flex;align-items:flex-end;padding:24px;
  transition:background .3s;
}
.srvprev__item:hover .srvprev__over{background:linear-gradient(to top,rgba(200,90,26,.75) 0%,transparent 65%)}
.srvprev__label{color:var(--white)}
.srvprev__label h3{font-family:var(--ff-d);font-size:1.4rem;font-weight:700;margin-bottom:4px}
.srvprev__label p{font-size:12px;opacity:.75;letter-spacing:.04em}

/* Testimonials */
.testi__grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:52px;
}
.testi{
  padding:30px 28px;border-radius:18px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  transition:all .3s;
}
.testi:hover{background:rgba(255,255,255,.1);border-color:rgba(200,90,26,.4)}
.testi__stars{color:var(--ember);font-size:1rem;letter-spacing:2px;margin-bottom:14px}
.testi__q{
  font-family:var(--ff-i);font-style:italic;font-size:1.1rem;
  color:rgba(255,255,255,.88);line-height:1.7;margin-bottom:20px;
}
.testi__author{display:flex;align-items:center;gap:12px}
.testi__avatar{
  width:42px;height:42px;border-radius:50%;
  background:var(--rust);display:flex;align-items:center;justify-content:center;
  font-family:var(--ff-d);font-weight:700;color:var(--white);font-size:.95rem;
  flex-shrink:0;
}
.testi__name{font-weight:600;font-size:.88rem;color:rgba(255,255,255,.85)}
.testi__loc{font-size:.78rem;color:rgba(255,255,255,.45)}

/* About preview */
.aboutprev__grid{
  display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;
}
.aboutprev__imgs{position:relative;height:480px}
.ap__img1{
  position:absolute;top:0;left:0;
  width:72%;height:78%;object-fit:cover;
  border-radius:6px 24px 6px 24px;
  box-shadow:0 28px 64px rgba(0,0,0,.16);
}
.ap__img2{
  position:absolute;bottom:0;right:0;
  width:55%;height:55%;object-fit:cover;
  border-radius:24px 6px 24px 6px;
  box-shadow:0 18px 48px rgba(0,0,0,.2);
  border:5px solid var(--marble);
}
.ap__badge{
  position:absolute;top:50%;right:-18px;transform:translateY(-50%);z-index:2;
  background:var(--rust);color:var(--white);
  padding:16px 20px;border-radius:14px;text-align:center;
  box-shadow:0 10px 28px rgba(200,90,26,.4);
}
.ap__badge-n{font-family:var(--ff-d);font-size:1.8rem;font-weight:900;line-height:1}
.ap__badge-t{font-size:10px;letter-spacing:.1em;opacity:.85;margin-top:3px}

/* Final CTA (home) */
.final-cta{
  text-align:center;padding:100px 40px;
  background:
    linear-gradient(135deg,rgba(30,58,47,.94) 0%,rgba(17,26,20,.98) 100%),
    url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1400&q=75') center/cover;
}
.final-cta h2{font-family:var(--ff-d);font-size:clamp(2.2rem,4vw,3.6rem);color:var(--white);margin-bottom:16px}
.final-cta h2 em{font-style:italic;font-weight:400;color:var(--ember)}
.final-cta p{color:rgba(255,255,255,.6);max-width:480px;margin:0 auto 36px;font-size:1rem;line-height:1.8}
.final-cta__btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ═══════════════════════════════════
   PAGE 2 — ABOUT
═══════════════════════════════════ */
.about-hero{
  min-height:52vh;position:relative;overflow:hidden;
  display:flex;align-items:flex-end;
}
.about-hero__bg{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(17,26,20,.6) 0%,rgba(17,26,20,.75) 100%),
    url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=1400&q=80') center/cover;
}
.about-hero__content{
  position:relative;z-index:2;
  max-width:1160px;margin:0 auto;padding:0 40px 72px;width:100%;
}
.about-hero__content h1{
  font-size:clamp(2.8rem,5.5vw,5rem);font-weight:900;color:var(--white);
  margin-bottom:18px;
}
.about-hero__content h1 em{font-style:italic;font-weight:400;color:var(--ember)}
.about-hero__content p{color:rgba(255,255,255,.7);font-size:1.1rem;max-width:520px;line-height:1.8}

/* Timeline / Story */
.story__grid{
  display:grid;grid-template-columns:1fr 2px 1fr;gap:0 40px;margin-top:60px;
}
.story__line{
  background:linear-gradient(180deg,var(--rust),var(--gold),var(--rust));
  border-radius:2px;position:relative;
}
.story__col{display:flex;flex-direction:column;gap:48px}
.story__col--right{padding-top:60px}
.story__item{padding:28px;border-radius:16px;background:var(--white);border:1px solid var(--mist);position:relative}
.story__item::after{
  content:'';position:absolute;top:28px;width:14px;height:14px;
  background:var(--rust);border-radius:50%;border:3px solid var(--marble);
}
.story__col--left .story__item::after{right:-49px}
.story__col--right .story__item::after{left:-49px}
.story__year{
  font-family:var(--ff-i);font-style:italic;font-size:1rem;
  color:var(--rust);margin-bottom:8px;
}
.story__item h3{font-family:var(--ff-d);font-size:1.1rem;font-weight:700;margin-bottom:8px}
.story__item p{font-size:.88rem;color:#7a6a50;line-height:1.7}

/* Mission cards */
.mission__grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:52px;
}
.mission-card{
  padding:36px 28px;border-radius:20px;
  background:var(--ink);color:var(--white);
  position:relative;overflow:hidden;transition:transform .3s;
}
.mission-card:hover{transform:translateY(-6px)}
.mission-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 80% 20%,rgba(200,90,26,.15),transparent 60%);
}
.mission-card__ico{font-size:2.4rem;margin-bottom:18px;display:block;position:relative}
.mission-card h3{font-family:var(--ff-d);font-size:1.2rem;font-weight:700;margin-bottom:10px;position:relative}
.mission-card p{font-size:.88rem;color:rgba(255,255,255,.58);line-height:1.7;position:relative}

/* Team values */
.values__list{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:52px;
}
.val-item{
  display:flex;gap:18px;align-items:flex-start;
  padding:22px 24px;border-radius:16px;
  background:var(--white);border:1px solid var(--mist);
  transition:all .3s;
}
.val-item:hover{border-color:rgba(200,90,26,.35);box-shadow:0 8px 28px rgba(0,0,0,.07);transform:translateX(6px)}
.val-item__ico{font-size:1.6rem;flex-shrink:0;margin-top:2px}
.val-item h4{font-weight:600;margin-bottom:5px;font-size:.95rem}
.val-item p{font-size:.85rem;color:#8a7a5a;line-height:1.65}

/* ═══════════════════════════════════
   PAGE 3 — SERVICES
═══════════════════════════════════ */
.srv-hero{
  min-height:48vh;display:flex;align-items:flex-end;position:relative;overflow:hidden;
}
.srv-hero__bg{
  position:absolute;inset:0;
  background:
